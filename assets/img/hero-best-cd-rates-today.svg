<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs>
<radialGradient id="bg" cx="30%" cy="20%" r="120%">
<stop offset="0%" stop-color="#141B3C"/><stop offset="55%" stop-color="#0B1020"/><stop offset="100%" stop-color="#070A16"/>
</radialGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5BC8C3"/><stop offset="100%" stop-color="#8B7CF0"/></linearGradient>
<linearGradient id="gbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D9B36A"/><stop offset="100%" stop-color="#E8C983"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1020" cy="120" r="210" fill="#8B7CF0" opacity="0.07"/>
<circle cx="150" cy="580" r="180" fill="#5BC8C3" opacity="0.06"/>
<!-- podium bars: rising APY concept -->
<g filter="url(#glow)">
<rect x="200" y="430" width="130" height="150" rx="10" fill="url(#bar)" opacity="0.55"/>
<rect x="380" y="360" width="130" height="220" rx="10" fill="url(#bar)" opacity="0.75"/>
<rect x="560" y="290" width="130" height="290" rx="10" fill="url(#bar)"/>
<rect x="740" y="230" width="130" height="350" rx="10" fill="url(#gbar)"/>
</g>
<!-- coin discs stacked -->
<g opacity="0.9">
<ellipse cx="805" cy="215" rx="58" ry="14" fill="none" stroke="#D9B36A" stroke-width="2.5"/>
<ellipse cx="805" cy="230" rx="58" ry="14" fill="none" stroke="#D9B36A" stroke-width="2" opacity="0.6"/>
<ellipse cx="805" cy="245" rx="58" ry="14" fill="none" stroke="#D9B36A" stroke-width="2" opacity="0.35"/>
</g>
<!-- glass vault door hint -->
<g opacity="0.5" filter="url(#glow)">
<circle cx="1000" cy="430" r="95" fill="none" stroke="#5BC8C3" stroke-width="2.5"/>
<circle cx="1000" cy="430" r="62" fill="none" stroke="#8B7CF0" stroke-width="2"/>
<circle cx="1000" cy="430" r="10" fill="#5BC8C3"/>
<line x1="1000" y1="368" x2="1000" y2="335" stroke="#5BC8C3" stroke-width="2.5"/>
<line x1="1000" y1="492" x2="1000" y2="525" stroke="#5BC8C3" stroke-width="2.5"/>
<line x1="938" y1="430" x2="905" y2="430" stroke="#5BC8C3" stroke-width="2.5"/>
<line x1="1062" y1="430" x2="1095" y2="430" stroke="#5BC8C3" stroke-width="2.5"/>
</g>
<!-- ascending arrow -->
<g filter="url(#glow)">
<path d="M 250 470 L 460 400 L 650 330 L 830 260" fill="none" stroke="#5BC8C3" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<path d="M 830 260 l -34 -6 m 34 6 l -10 32" fill="none" stroke="#5BC8C3" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- small calendar/clock node -->
<g opacity="0.85">
<rect x="120" y="150" width="150" height="120" rx="14" fill="rgba(91,200,195,0.08)" stroke="#5BC8C3" stroke-width="1.5"/>
<line x1="120" y1="182" x2="270" y2="182" stroke="#5BC8C3" stroke-width="1.5"/>
<line x1="150" y1="150" x2="150" y2="132" stroke="#5BC8C3" stroke-width="2.5" stroke-linecap="round"/>
<line x1="240" y1="150" x2="240" y2="132" stroke="#5BC8C3" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="175" cy="215" r="6" fill="#8B7CF0"/><circle cx="205" cy="215" r="6" fill="#5BC8C3"/><circle cx="235" cy="215" r="6" fill="#D9B36A"/>
</g>
</svg>