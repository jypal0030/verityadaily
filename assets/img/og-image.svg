<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D1117"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2332" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Indigo accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#4F46E5"/>
  <!-- Logo monogram -->
  <rect x="80" y="80" width="100" height="100" rx="24" fill="#4F46E5"/>
  <path d="M100 110 L130 180 L160 110" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Wordmark -->
  <text x="200" y="165" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Veritya Daily</text>
  <!-- Tagline -->
  <text x="82" y="310" font-family="Source Serif 4, Georgia, serif" font-size="64" font-weight="700" fill="#E6EDF3" letter-spacing="-1.5">Truth in tech, crypto,</text>
  <text x="82" y="390" font-family="Source Serif 4, Georgia, serif" font-size="64" font-weight="700" fill="#E6EDF3" letter-spacing="-1.5">and finance.</text>
  <!-- Category badges -->
  <rect x="82" y="450" width="140" height="40" rx="20" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="152" y="476" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8" text-anchor="middle">AI</text>
  <rect x="234" y="450" width="140" height="40" rx="20" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="304" y="476" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8" text-anchor="middle">Crypto</text>
  <rect x="386" y="450" width="140" height="40" rx="20" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="456" y="476" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8" text-anchor="middle">Finance</text>
  <rect x="538" y="450" width="160" height="40" rx="20" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="618" y="476" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8" text-anchor="middle">Cybersecurity</text>
  <rect x="710" y="450" width="140" height="40" rx="20" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="780" y="476" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8" text-anchor="middle">Technology</text>
  <!-- URL -->
  <text x="82" y="555" font-family="JetBrains Mono, monospace" font-size="20" font-weight="400" fill="#6B7280">verityadaily.com</text>
</svg>
